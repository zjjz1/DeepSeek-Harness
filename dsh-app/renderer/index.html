<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://127.0.0.1:3080; style-src 'self' 'unsafe-inline'; img-src 'self' data: http://127.0.0.1:3080;">
  <title>DeepSeek Harness</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ 顶部原生拖动条（Windows 原生拖动 / Aero Snap / 自动对齐） ============ -->
  <div id="titlebar-drag" class="titlebar-drag"></div>

  <!-- ============ 顶部控制层（仅定位，永不拦截鼠标） ============ -->
  <div id="chrome" class="chrome-hidden"></div>

  <!-- ============ 窗口按钮组（独立 fixed，最高层级，确保真实点击可达；no-drag） ============ -->
  <div id="win-btns" class="win-btns win-btns-hidden">
    <div class="win-btn" id="btn-min" title="最小化">
      <svg viewBox="0 0 12 12" width="12" height="12"><line x1="1" y1="6" x2="11" y2="6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </div>
    <div class="win-btn" id="btn-max" title="最大化/还原">
      <svg viewBox="0 0 12 12" width="12" height="12"><rect x="2" y="2" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.3" rx="1.5"/></svg>
    </div>
    <div class="win-btn win-btn-close" id="btn-close" title="关闭">
      <svg viewBox="0 0 12 12" width="12" height="12"><path d="M3,3 L9,9 M9,3 L3,9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </div>
  </div>

  <!-- ============ 多开提示弹窗 ============ -->
  <div id="multi-overlay" class="overlay hidden">
    <div class="modal">
      <div class="modal-title">DeepSeek Harness 已在运行</div>
      <div class="modal-body">检测到程序已在运行，是否打开主窗口？</div>
      <div class="modal-btns">
        <button id="multi-cancel">取消</button>
        <button id="multi-open" class="primary">打开</button>
      </div>
    </div>
  </div>

  <!-- ============ 崩溃弹窗 ============ -->
  <div id="crash-overlay" class="overlay hidden">
    <div class="modal">
      <div class="modal-title">DeepSeek Harness 服务已停止</div>
      <div class="modal-body">服务连接中断，网页可能无法访问。</div>
      <div class="modal-btns">
        <button id="crash-later">稍后再说</button>
        <button id="crash-restart" class="primary">重启服务</button>
      </div>
    </div>
  </div>

  <!-- ============ 退出确认弹窗（自绘，与崩溃弹窗同风格） ============ -->
  <div id="exit-overlay" class="overlay hidden">
    <div class="modal">
      <div class="modal-title">退出 DeepSeek Harness</div>
      <div class="modal-body">关闭窗口还是最小化到托盘？<br>最小化到托盘后，程序会继续在后台运行（服务不中断）。</div>
      <label class="exit-remember">
        <input type="checkbox" id="exit-remember">
        <span>记住我的选择，下次不再询问</span>
      </label>
      <div class="modal-btns">
        <button id="exit-min">最小化到托盘</button>
        <button id="exit-quit" class="primary">退出程序</button>
      </div>
    </div>
  </div>

  <!-- ============ 首次初始化（下载运行组件） ============ -->
  <div id="init-overlay" class="overlay hidden">
    <div class="modal init-modal">
      <div class="init-spinner"></div>
      <div class="modal-title">正在初始化 DeepSeek Harness</div>
      <div class="modal-body" id="init-text">正在下载运行组件，请保持网络连接…</div>
      <div class="modal-btns init-btns hidden" id="init-btns">
        <button id="init-cancel">取消</button>
        <button id="init-ok" class="primary">继续</button>
      </div>
    </div>
  </div>

  <!-- ============ Harness 网页容器 ============ -->
  <!-- webview 桥由主进程 session.setPreloads 注入（见 main.js），
       标签不再写 preload 属性，避免路径解析兼容问题。 -->
  <div id="web-container">
    <webview id="harness-view" src="http://127.0.0.1:3080"></webview>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
